<!DOCTYPE html>
<html>

<head>
	<title>Video to MP4 client-side converter</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:creator" content="@steren">
	<meta name="twitter:title" content="Online Video to MP4 client-side converter">
	<meta name="twitter:image" content="https://video-to-mp4.client-side.app/icons/title.png">

	<meta property="og:type" content="article">
	<meta property="og:title" content="Online Video to MP4 client-side converter">
	<meta property="og:image" content="https://video-to-mp4.client-side.app/icons/title.png">

	<script type="application/ld+json">
	{
	  "@context": "http://schema.org",
	  "@type": "WebSite",
	  "author": "Steren Giannini",
	  "name": "Online Video to MP4 client-side converter",
	  "image": "https://video-to-mp4.client-side.app/icons/title.png"
	}
	</script>

	<link rel="manifest" href="manifest.json">

	<style>
		html {
			max-width: 70ch;
			padding: 3em 1em;
			margin: auto;
			line-height: 1.75;
			font-size: 1.25em;
			font-family: sans-serif;
		}

		h1,
		h2,
		h3,
		h4,
		h5,
		h6 {
			margin: 3em 0 1em;
		}

		p,
		ul,
		ol {
			margin-bottom: 2em;
		}

		.icon {
			float: left;
			margin-right: 1em;
			width: 3em;
			height: 3em;
		}

		pre {
			overflow-x: auto;
			font-size: 0.8em;
		}

		footer {
			font-size: small;
		}
	</style>

</head>

<body>

	<header>
		<img src="icons/icon.svg" alt="icon" class="icon">
		<h1>An online Video to MP4 converter</h1>
		<p>
			An online <b>client-side</b> web app to transform any video file into a .mp4 file.<br>
			Files are <b>not</b> uploaded to any server, they are converted in your browser.
		</p>
	</header>

	<main>
		<div>
			<label for="videoInput">Select a video file:</label>
			<input type="file" id="videoInput" accept="video/*">
		</div>

		<button id="createBtn" disabled>Convert to MP4</button>

		<progress id="progressBar" value="0" max="100" style="display: none;"></progress>

		<video id="videoPreview" width="320" height="240" controls style="display: none;"></video>

		<button id="downloadBtn" style="display: none;">Download MP4</button>
	</main>

	<footer>
		<p>
			Built by <a target="_blank" href="https://steren.fr">Steren</a> using <a target="_blank"
				href="https://github.com/ffmpegwasm/ffmpeg.wasm">ffmpeg.wasm</a> (<a
				href="https://github.com/client-side-apps/video-to-mp4">source code</a>).
		</p>
	</footer>

	<script type="module">
		// Load ffmpeg.wasm
		import { fetchFile } from "/node_modules/@ffmpeg/util/dist/esm/index.js";
		import { FFmpeg } from "/node_modules/@ffmpeg/ffmpeg/dist/esm/index.js";


		const baseURL = '/node_modules/@ffmpeg/core/dist/esm';
		const ffmpeg = new FFmpeg()
		await ffmpeg.load({
			coreURL: await `${baseURL}/ffmpeg-core.js`,
			wasmURL: await `${baseURL}/ffmpeg-core.wasm`,
			workerURL: await `${baseURL}/ffmpeg-core.worker.js`,
		});


		const videoInput = document.getElementById('videoInput');
		const createBtn = document.getElementById('createBtn');
		const downloadBtn = document.getElementById('downloadBtn');
		const progressBar = document.getElementById('progressBar');
		const videoPreview = document.getElementById('videoPreview');

		let videoData;
		let inputVideoFile;

		videoInput.addEventListener('change', async (e) => {
			inputVideoFile = e.target.files[0];
			if (inputVideoFile) {
				createBtn.disabled = false;
			}
		});

		downloadBtn.addEventListener('click', () => {
			const url = URL.createObjectURL(new Blob([videoData], { type: 'video/mp4' }));
			const link = document.createElement('a');
			link.href = url;
			link.download = 'video.mp4';
			link.click();
		});

		createBtn.addEventListener('click', createVideo);

		async function createVideo() {
			if (!inputVideoFile) {
				alert('Please select a video file.');
				return;
			}

			progressBar.style.display = 'block';
			createBtn.disabled = true;

			const inputName = 'input.' + inputVideoFile.name.split('.').pop();
			await ffmpeg.writeFile(inputName, await fetchFile(inputVideoFile));

			console.log("converting");
			await ffmpeg.exec(["-i", inputName, "output.mp4"]);
			console.log("converted");

			videoData = await ffmpeg.readFile('output.mp4');
			const videoUrl = URL.createObjectURL(new Blob([videoData.buffer], { type: 'video/mp4' }));
			videoPreview.src = videoUrl;
			videoPreview.style.display = 'block';

			downloadBtn.style.display = 'block';
			createBtn.disabled = false;
		}

		ffmpeg.on("log", ({ message }) => {
			console.log(message);
		});

		ffmpeg.on("progress", ({ progress, time }) => {
			progressBar.value = progress * 100;
		});
	</script>

	<script>
		navigator.serviceWorker.register('sw.js')
	</script>

</body>

</html>
